<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Hoja de Rodaje Las Vegas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a film call sheet for one phone in one hand at the field. Clapper stripes = Juventus stripes; one column, big tap targets, light-first for sunlight. */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --ink:#141414; --muted:#5E5B54; --line:#DAD6CC;
  --gold:#8A6A1F; --gold-soft:#F1E7CF; --done:#2F6B3F; --done-soft:#E2EFE4; --warn:#9A4B12; --warn-soft:#F7E6D8;
  --stripe-a:#141414; --stripe-b:#FFFFFF;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E0D; --surface:#191917; --ink:#F2F0EA; --muted:#A8A396; --line:#2E2D29;
  --gold:#C9A34E; --gold-soft:#2A2416; --done:#7CC48E; --done-soft:#16261A; --warn:#E39A62; --warn-soft:#2B1D13;
  --stripe-a:#F2F0EA; --stripe-b:#0E0E0D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0D; --surface:#191917; --ink:#F2F0EA; --muted:#A8A396; --line:#2E2D29;
  --gold:#C9A34E; --gold-soft:#2A2416; --done:#7CC48E; --done-soft:#16261A; --warn:#E39A62; --warn-soft:#2B1D13;
  --stripe-a:#F2F0EA; --stripe-b:#0E0E0D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.clap{height:14px;background:repeating-linear-gradient(-45deg,var(--stripe-a) 0 14px,var(--stripe-b) 14px 28px);border-bottom:2px solid var(--stripe-a)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog .lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:600 13px var(--f-mono);padding:7px 11px;background:transparent;color:var(--muted);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero{padding-block:22px 6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,11vw,60px);line-height:.92;letter-spacing:.005em;margin:6px 0 10px;text-wrap:balance;text-transform:uppercase}
.slate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--surface)}
.slate div{padding:8px 10px;border-right:1px solid var(--line);min-width:0}
.slate div:last-child{border-right:0}
.slate small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slate b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1;font-weight:700;overflow-wrap:anywhere}
.demo{margin-top:14px;font-size:13.5px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:9px 12px}
section{margin-top:30px}
h2{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.01em;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;text-wrap:balance}
h2 .ct{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
h3{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.list{display:grid;gap:10px}
.shot{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;transition:background .2s,border-color .2s}
.shot.done{background:var(--done-soft);border-color:var(--done)}
.ref{width:104px;aspect-ratio:9/16;max-width:100%;border-radius:5px;overflow:hidden;background:var(--line);border:0;padding:0;cursor:zoom-in;position:relative}
.ref img{width:100%;height:100%;object-fit:cover;display:block}
.ref svg{width:100%;height:100%;display:block}
.ref .tag{position:absolute;left:0;bottom:0;right:0;font:600 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:3px 5px;text-align:left}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.num{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--gold)}
.ttl{font-weight:700;font-size:17px;line-height:1.2;text-wrap:balance}
.desc{font-size:14.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11.5px var(--f-mono);letter-spacing:.03em;padding:3px 7px;border-radius:4px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums}
.chip.uso{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.check{margin-top:2px;display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 15px var(--f-body);cursor:pointer;align-self:flex-start}
.check .box{width:22px;height:22px;border:2px solid currentColor;border-radius:4px;display:grid;place-items:center;flex:none}
.check .box svg{width:14px;height:14px;opacity:0}
.shot.done .check{border-color:var(--done);color:var(--done)}
.shot.done .check .box{background:var(--done);border-color:var(--done)}
.shot.done .check .box svg{opacity:1}
.shot.done .check .box svg path{stroke:var(--surface)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pend{display:grid;gap:8px}
.pend .shot{grid-template-columns:minmax(0,1fr);border-color:var(--warn);border-style:dashed}
.pend .from{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.quote{background:var(--surface);border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:12px 14px;display:grid;gap:6px}
.quote small{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.quote .main{font-size:17.5px;font-weight:600;line-height:1.35}
.quote .alt{font-size:14.5px;color:var(--muted)}
.copy{align-self:flex-start;font:600 12px var(--f-mono);padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
ol.rules{margin:0;padding:0;list-style:none;display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;counter-reset:r}
ol.rules li{counter-increment:r;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:10px 12px;border-top:1px solid var(--line);font-size:15px}
ol.rules li:first-child{border-top:0}
ol.rules li::before{content:counter(r,decimal-leading-zero);font:600 12px var(--f-mono);color:var(--gold);padding-top:3px}
.cal{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.cal .row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.cal .row:first-child{border-top:0}
.cal .d{font:600 13px var(--f-mono);color:var(--gold);font-variant-numeric:tabular-nums;padding-top:2px}
.cal b{display:block;font-size:15.5px}
.cal span{font-size:14px;color:var(--muted)}
.deliver{background:var(--ink);color:var(--bg);border-radius:8px;padding:16px;display:grid;gap:10px}
.deliver p{margin:0;font-size:15px}
.deliver code{font-family:var(--f-mono);font-size:14px;background:rgba(127,127,127,.25);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}
.deliver .btn{font:700 15px var(--f-body);padding:12px 14px;border-radius:6px;border:1.5px dashed var(--bg);color:var(--bg);background:transparent;text-align:center;opacity:.75}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,520px)}
dialog::backdrop{background:rgba(0,0,0,.82)}
dialog img{width:100%;border-radius:8px;display:block}
dialog button{margin-top:10px;width:100%;font:700 15px var(--f-body);padding:12px;border-radius:6px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
footer{margin-top:34px;font-size:13px;color:var(--muted);text-align:left}
@media (min-width:560px){.shot{grid-template-columns:132px minmax(0,1fr)}.ref{width:132px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<div class="clap" aria-hidden="true"></div>
<header class="top"><div class="bar">
  <div class="prog"><div class="lbl" id="progLbl"></div><div class="track"><i id="progBar"></i></div></div>
  <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" id="bEs" data-l="es">ES</button><button type="button" id="bEn" data-l="en">EN</button></div>

<main class="wrap">
  <div class="hero">
    <div class="eyebrow">Juventus Academy Las Vegas</div>
    <h1 id="h1"></h1>
    <div class="slate">
      <div><small id="sFecha"></small><b id="vFecha"></b></div>
      <div><small id="sLugar"></small><b id="vLugar"></b></div>

  <section><h2><span id="tTomas"></span><span class="ct" id="cTomas"></span></h2><div id="tomas"></div></section>
  <section><h2 id="tFrases"></h2><div class="list" id="frases"></div></section>
  <section><h2 id="tReglas"></h2><ol class="rules" id="reglas"></ol></section>
  <section><h2 id="tProx"></h2><div class="cal" id="prox"></div></section>
  <section><h2 id="tEntrega"></h2><div class="deliver" id="entrega"></div></section>
  <footer id="foot"></footer>
</main>
<dialog id="zoom"><img id="zImg" alt=""><button type="button" id="zClose"></button></dialog>

  r.append(el('span','tag',t.img?T[L].refT:T[L].encuadre));
  const b=el('div','body');
  b.append(el('div','num','TOMA '+String(t.n).padStart(2,'0')),el('div','ttl',t[L][0]),el('div','desc',t[L][1]));
  const ch=el('div','chips');ch.append(el('span','chip',t.fmt),el('span','chip',t.seg),el('span','chip uso',t.uso[L]));b.append(ch);
  const k=el('button','check');k.type='button';k.id='chk'+t.n;k.setAttribute('aria-pressed',done);
  k.innerHTML='<span class="box">'+CHECK+'</span>';k.append(done?T[L].hecha:T[L].marcar);
  k.onclick=()=>{hechas.has(t.n)?hechas.delete(t.n):hechas.add(t.n);S.set('rodaje_lv_hechas',[...hechas]);render()};
  b.append(k);c.append(r,b);return c}

function render(){
  const t=T[L];document.documentElement.lang=L;$('bEs').setAttribute('aria-pressed',L==='es');$('bEn').setAttribute('aria-pressed',L==='en');
  const n=D.tomas.length,h=D.tomas.filter(x=>hechas.has(x.n)).length;
  $('progLbl').textContent=t.prog(h,n);$('progBar').style.width=(100*h/n)+'%';
  $('h1').textContent=t.h1;$('sFecha').textContent=t.fecha;$('sLugar').textContent=t.lugar;$('sTomas').textContent=t.tomas;
  $('vFecha').textContent=D.visita[L].split('·')[1].trim();$('vLugar').textContent=D.visita.lugar;$('vTomas').textContent=n+(D.pendientes.length?' + '+D.pendientes.length:'');
  $('demo').textContent=t.demo;
  $('tPend').textContent=t.pend;$('cPend').textContent=D.pendientes.length;
  const p=$('pend');p.textContent='';for(const x of D.pendientes){const c=el('article','shot');const b=el('div','body');b.append(el('div','from',x.origen[L]),el('div','ttl',x[L]));c.append(b);p.append(c)}
  $('tTomas').textContent=t.tom;$('cTomas').textContent=n;
  const box=$('tomas');box.textContent='';
  for(const [g,es,en] of D.grupos){const xs=D.tomas.filter(x=>x.grupo===g);if(!xs.length)continue;box.append(el('h3','',L==='es'?es:en));const l=el('div','list');xs.forEach((x,i)=>l.append(shotCard(x,i)));box.append(l)}
  $('tFrases').textContent=t.frases;const f=$('frases');f.textContent='';
  for(const q of D.frases){const c=el('div','quote');const main=L==='es'?q.es:q.en,alt=L==='es'?q.en:q.es;c.append(el('small','',q.quien[L]),el('div','main',main),el('div','alt',alt));
    const cp=el('button','copy',t.copiar);cp.type='button';cp.onclick=async()=>{try{await navigator.clipboard.writeText(main.replace(/^"|"$/g,''));cp.textContent=t.copiado}catch(e){const s=getSelection(),rg=document.createRange();rg.selectNodeContents(c.querySelector('.main'));s.removeAllRanges();s.addRange(rg)}};
    c.append(cp);f.append(c)}
  $('tReglas').textContent=t.reglas;const r=$('reglas');r.textContent='';for(const x of D.reglas[L])r.append(el('li','',x));
  $('tProx').textContent=t.prox;const pr=$('prox');pr.textContent='';
  for(const [d,nm,es,en] of D.proximas){const row=el('div','row');const tx=el('div');tx.append(el('b','',nm),el('span','',(L==='es'?es:en)+' · '+t.fechaAprox));row.append(el('span','d',d),tx);pr.append(row)}
  $('tEntrega').textContent=t.entrega;const e=$('entrega');e.textContent='';
  const p2=el('p');p2.append(t.ent2+' ',el('code','','LV_1015_toma04.mp4'));
  e.append(el('p','',t.ent1),p2,el('div','btn',t.btn));
  $('foot').textContent=t.foot;$('zClose').textContent=t.cerrar}
$('bEs').onclick=()=>{L='es';S.set('rodaje_lv_lang',L);render()};
$('bEn').onclick=()=>{L='en';S.set('rodaje_lv_lang',L);render()};
$('zClose').onclick=()=>$('zoom').close();
$('zoom').addEventListener('click',e=>{if(e.target===$('zoom'))$('zoom').close()});
render();
</script>
